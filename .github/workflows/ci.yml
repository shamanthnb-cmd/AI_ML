name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Settings come from GitHub: Settings > Secrets and variables > Actions > Variables
env:
  AI_ENV: ci
  LOG_LEVEL: ${{ vars.LOG_LEVEL }}
  MODEL_DIR: ${{ vars.MODEL_DIR }}
  ONNX_NUM_THREADS: ${{ vars.ONNX_NUM_THREADS }}

jobs:
  # Stage 1: dependencies install and key libraries import
  dependencies:
    name: 1. Dependency validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 
      - name: Check environment
        run: python scripts/verify_env.py

  # Stage 2: style and quality checks
  quality:
    name: 2. Code quality
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt

  # Stage 3: unit tests (no camera or model files needed)
  tests:
    name: 3. Unit tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt 
      - name: Run pytest
        run: |
          # Exit code 5 means "no tests found yet"; allow it until tests exist
          pytest tests/ -v || [ $? -eq 5 ]

  # Stage 4: Docker image builds
  build:
    name: 4. Build validation
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: team1-ai-ml:ci
      # Optional: run the check script inside the image
      # - run: docker run --rm team1-ai-ml:ci
